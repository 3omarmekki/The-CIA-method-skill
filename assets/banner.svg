<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="The CIA Challenge Framework pipeline">
  <rect width="1200" height="390" fill="#0C0E15"/>

  <!-- subtle grid -->
  <g stroke="#1C2030" stroke-width="1" opacity="0.6">
    <line x1="24" y1="130" x2="1176" y2="130"/>
    <line x1="24" y1="248" x2="1176" y2="248"/>
    <line x1="24" y1="252" x2="1176" y2="252"/>
  </g>

  <!-- title -->
  <text x="600" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#EAD9BC" letter-spacing="6">THE CIA CHALLENGE FRAMEWORK</text>
  <text x="600" y="84" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9A8F7E">Pressure, not flattery — a 5-step critique sequence that stops you from locking onto the first plausible story.</text>
  <text x="600" y="110" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F7A901" letter-spacing="4">ASSUME → COMPARE → INVERT → ATTACK → DECIDE</text>

  <!-- pipeline boxes -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g>
      <rect x="24"  y="140" width="190" height="86" rx="12" fill="#141829" stroke="#3A3F55"/>
      <text x="119"  y="170" text-anchor="middle" font-size="11" fill="#F7A901" letter-spacing="3">01</text>
      <text x="119"  y="198" text-anchor="middle" font-size="15" fill="#EAD9BC">Key Assumptions</text>
    </g>
    <g>
      <rect x="264" y="140" width="190" height="86" rx="12" fill="#141829" stroke="#3A3F55"/>
      <text x="359" y="170" text-anchor="middle" font-size="11" fill="#F7A901" letter-spacing="3">02</text>
      <text x="359" y="198" text-anchor="middle" font-size="15" fill="#EAD9BC">Alternatives</text>
    </g>
    <g>
      <rect x="504" y="140" width="190" height="86" rx="12" fill="#141829" stroke="#3A3F55"/>
      <text x="599" y="170" text-anchor="middle" font-size="11" fill="#F7A901" letter-spacing="3">03</text>
      <text x="599" y="198" text-anchor="middle" font-size="15" fill="#EAD9BC">Hypotheses</text>
    </g>
    <g>
      <rect x="744" y="140" width="190" height="86" rx="12" fill="#141829" stroke="#3A3F55"/>
      <text x="839" y="170" text-anchor="middle" font-size="11" fill="#F7A901" letter-spacing="3">04</text>
      <text x="839" y="198" text-anchor="middle" font-size="15" fill="#EAD9BC">What-if</text>
    </g>
    <g>
      <rect x="984" y="140" width="190" height="86" rx="12" fill="#141829" stroke="#3A3F55"/>
      <text x="1079" y="170" text-anchor="middle" font-size="11" fill="#F7A901" letter-spacing="3">05</text>
      <text x="1079" y="198" text-anchor="middle" font-size="15" fill="#EAD9BC">Red-team</text>
    </g>

    <!-- arrows -->
    <g font-size="20" fill="#F7A901" text-anchor="middle">
      <text x="239" y="188">→</text>
      <text x="479" y="188">→</text>
      <text x="719" y="188">→</text>
      <text x="959" y="188">→</text>
    </g>
  </g>

  <!-- deliverable -->
  <g>
    <rect x="24" y="272" width="1152" height="92" rx="12" fill="#191D2F" stroke="#F7A901" stroke-opacity="0.45"/>
    <text x="48" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F7A901" letter-spacing="3">DELIVERABLE</text>
    <text x="48" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#EAD9BC">The highest-risk failure · the one assumption that would break the idea · the next concrete test to run</text>
    <text x="48" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F7A901">VERDICT  —  GO   ·   GO WITH CONDITIONS   ·   DON'T</text>
  </g>
</svg>